name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false

      - name: gofmt and go vet
        working-directory: app
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Hadolint (Dockerfile lint)
        run: docker run --rm -i hadolint/hadolint < Dockerfile

  build-scan-push:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --build-arg VERSION="${GITHUB_SHA::7}" -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Trivy scan (fails on HIGH or CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "$IMAGE:${GITHUB_SHA::7}"

      - name: Push to GHCR (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
